name: Type check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Pyright (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The widened stub bound selects distinct releases on 3.9 and 3.10+.
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install declared development dependencies
        run: uv sync --group dev
      - name: Show resolved Windows stubs
        run: uv run --no-sync python -c "from importlib.metadata import version; print(version('types-pywin32'))"
      - name: Run configured Pyright
        run: uv run --no-sync pyright --pythonpath .venv/Scripts/python.exe
